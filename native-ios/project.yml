name: AudioRecorder
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ADMOB_IOS_APP_ID: ca-app-pub-3940256099942544~1458002511
    ADMOB_IOS_BANNER_UNIT_ID: ca-app-pub-3940256099942544/2435281174
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 12.14.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    exactVersion: 3.1.0
targets:
  AudioRecorder:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - Info.plist
    dependencies:
      - sdk: AppTrackingTransparency.framework
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dmkr.audio.B2X6D3A9J9
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: AudioRecorder
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  AudioRecorderTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Tests
    dependencies:
      - target: AudioRecorder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.dmkr.audio.B2X6D3A9J9.tests
        CODE_SIGNING_ALLOWED: "NO"
schemes:
  AudioRecorder:
    build:
      targets:
        AudioRecorder: all
    test:
      targets:
        - AudioRecorderTests
