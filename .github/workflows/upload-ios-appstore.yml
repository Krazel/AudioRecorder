name: Upload iOS App Store Build

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Unique positive build number for the selected app version
        required: true
        type: string
      ad_configuration:
        description: AdMob configuration embedded in the signed build
        required: true
        default: test
        type: choice
        options:
          - test
          - production
      confirm_internal_testflight_only:
        description: Required to upload a test-ID build; confirms Internal TestFlight only (never external testing or App Review)
        required: true
        default: false
        type: boolean
      confirm_admob_idfa_message_unpublished:
        description: Required for production upload; confirms no AdMob IDFA message can automatically trigger ATT after a European refusal
        required: true
        default: false
        type: boolean
      validate_with_app_store:
        description: Validate the exported IPA with App Store Connect without uploading it for testing
        required: true
        default: false
        type: boolean
      upload_to_app_store:
        description: Upload the exported IPA to App Store Connect (does not submit it for review)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  upload:
    if: ${{ github.actor == github.repository_owner && github.ref == 'refs/heads/main' && !github.event.repository.private }}
    runs-on: macos-latest
    environment: app-store-production
    env:
      APP_VERSION: "1.0.6"
      APP_BUILD_NUMBER: ${{ inputs.build_number }}
      ADMOB_CONFIGURATION: ${{ inputs.ad_configuration }}
      ADMOB_TEST_APP_ID: ca-app-pub-3940256099942544~1458002511
      ADMOB_TEST_BANNER_UNIT_ID: ca-app-pub-3940256099942544/2435281174
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
      IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
      IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
      ADMOB_PRODUCTION_IOS_APP_ID: ${{ secrets.ADMOB_IOS_APP_ID }}
      ADMOB_PRODUCTION_IOS_BANNER_UNIT_ID: ${{ secrets.ADMOB_IOS_BANNER_UNIT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Apple submission toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk '/^Xcode / { split($2, version, "."); print version[1] }')"
          IOS_SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          IOS_SDK_MAJOR="${IOS_SDK_VERSION%%.*}"
          echo "iOS SDK ${IOS_SDK_VERSION}"
          if [[ -z "${XCODE_MAJOR}" ]] || (( XCODE_MAJOR < 26 )); then
            echo "Xcode 26 or later is required for App Store Connect submissions"
            exit 1
          fi
          if [[ -z "${IOS_SDK_MAJOR}" ]] || (( IOS_SDK_MAJOR < 26 )); then
            echo "The iOS 26 SDK or later is required for App Store Connect submissions"
            exit 1
          fi

      - name: Validate candidate build number
        run: |
          set -euo pipefail
          if [[ ! "${APP_BUILD_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "build_number must be a positive integer not previously used for version ${APP_VERSION}"
            exit 1
          fi
          echo "Preparing version ${APP_VERSION} build ${APP_BUILD_NUMBER}"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install App Store Connect API key
        run: |
          set -euo pipefail
          if [ -z "${ASC_KEY_ID}" ] || [ -z "${ASC_ISSUER_ID}" ] || [ -z "${ASC_PRIVATE_KEY_BASE64}" ] || [ -z "${APPLE_TEAM_ID}" ]; then
            echo "Missing ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY_BASE64, or APPLE_TEAM_ID secret"
            exit 1
          fi
          python3 - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          key_id = os.environ["ASC_KEY_ID"].strip().lstrip("\ufeff")
          issuer_id = os.environ["ASC_ISSUER_ID"].strip().lstrip("\ufeff")
          if not re.fullmatch(r"[A-Z0-9]{10}", key_id):
              raise SystemExit("ASC_KEY_ID does not have the expected format")
          if not re.fullmatch(r"[0-9A-Fa-f-]{36}", issuer_id):
              raise SystemExit("ASC_ISSUER_ID does not have the expected format")

          encoded = os.environ["ASC_PRIVATE_KEY_BASE64"].strip().lstrip("\ufeff")
          try:
              private_key = base64.b64decode(encoded, validate=True)
          except Exception as error:
              raise SystemExit(f"ASC_PRIVATE_KEY_BASE64 is not valid Base64: {error}")
          if not (
              private_key.startswith(b"-----BEGIN PRIVATE KEY-----")
              and private_key.rstrip().endswith(b"-----END PRIVATE KEY-----")
          ):
              raise SystemExit("Decoded App Store Connect key is not a valid PEM private key")

          private_key_directory = Path.home() / ".appstoreconnect" / "private_keys"
          private_key_directory.mkdir(parents=True, exist_ok=True)
          private_key_path = private_key_directory / f"AuthKey_{key_id}.p8"
          private_key_path.write_bytes(private_key)
          private_key_path.chmod(0o600)
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as github_environment:
              github_environment.write(f"ASC_KEY_ID={key_id}\n")
              github_environment.write(f"ASC_ISSUER_ID={issuer_id}\n")
              github_environment.write(f"ASC_PRIVATE_KEY_PATH={private_key_path}\n")
          PY

      - name: Install manual signing identity and profile
        run: |
          set -euo pipefail
          if [[ -z "${IOS_DISTRIBUTION_P12_BASE64}" || \
                -z "${IOS_DISTRIBUTION_P12_PASSWORD}" || \
                -z "${IOS_APP_STORE_PROFILE_BASE64}" ]]; then
            echo "Missing one or more manual iOS signing secrets"
            exit 1
          fi

          IOS_SIGNING_P12_PATH="$RUNNER_TEMP/VoiceRecorder-Distribution.p12"
          IOS_SIGNING_PROFILE_PATH="$RUNNER_TEMP/VoiceRecorder-App-Store.mobileprovision"
          IOS_SIGNING_PROFILE_PLIST="$RUNNER_TEMP/VoiceRecorder-App-Store.plist"
          export IOS_SIGNING_P12_PATH IOS_SIGNING_PROFILE_PATH IOS_SIGNING_PROFILE_PLIST
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          for environment_name, output_name in (
              ("IOS_DISTRIBUTION_P12_BASE64", "IOS_SIGNING_P12_PATH"),
              ("IOS_APP_STORE_PROFILE_BASE64", "IOS_SIGNING_PROFILE_PATH"),
          ):
              encoded = os.environ[environment_name].strip().lstrip("\ufeff")
              try:
                  decoded = base64.b64decode(encoded, validate=True)
              except Exception as error:
                  raise SystemExit(f"{environment_name} is not valid Base64: {error}")
              if not decoded:
                  raise SystemExit(f"{environment_name} decoded to an empty file")
              Path(os.environ[output_name]).write_bytes(decoded)
          PY
          chmod 600 "$IOS_SIGNING_P12_PATH" "$IOS_SIGNING_PROFILE_PATH"

          IOS_KEYCHAIN_PATH="$RUNNER_TEMP/voice-recorder-signing.keychain-db"
          IOS_KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::${IOS_KEYCHAIN_PASSWORD}"
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$IOS_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$IOS_KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$IOS_KEYCHAIN_PATH"
          ORIGINAL_KEYCHAINS="$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s "$IOS_KEYCHAIN_PATH" ${ORIGINAL_KEYCHAINS}
          security default-keychain -d user -s "$IOS_KEYCHAIN_PATH"
          security import "$IOS_SIGNING_P12_PATH" \
            -f pkcs12 \
            -k "$IOS_KEYCHAIN_PATH" \
            -P "$IOS_DISTRIBUTION_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security >/dev/null
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$IOS_KEYCHAIN_PASSWORD" \
            "$IOS_KEYCHAIN_PATH" >/dev/null

          SIGNING_IDENTITIES="$(
            security find-identity -v -p codesigning "$IOS_KEYCHAIN_PATH" |
              awk '/Apple Distribution/ { print $2 }'
          )"
          SIGNING_IDENTITY_COUNT="$(printf '%s\n' "$SIGNING_IDENTITIES" | grep -c '^[0-9A-Fa-f]\{40\}$' || true)"
          if [[ "$SIGNING_IDENTITY_COUNT" -ne 1 ]]; then
            echo "Expected exactly one valid Apple Distribution identity in the temporary keychain"
            security find-identity -v -p codesigning "$IOS_KEYCHAIN_PATH"
            exit 1
          fi
          IOS_SIGNING_IDENTITY_SHA1="$(printf '%s' "$SIGNING_IDENTITIES" | tr -d '[:space:]')"

          security cms -D -i "$IOS_SIGNING_PROFILE_PATH" > "$IOS_SIGNING_PROFILE_PLIST"
          export IOS_SIGNING_IDENTITY_SHA1
          python3 - <<'PY'
          import datetime
          import hashlib
          import os
          import plistlib
          from pathlib import Path

          expected_team = os.environ["APPLE_TEAM_ID"].strip().lstrip("\ufeff")
          expected_bundle = "com.dmkr.audio.B2X6D3A9J9"
          if expected_team != "B2X6D3A9J9":
              raise SystemExit("APPLE_TEAM_ID does not match the VoiceRecorder team")
          with Path(os.environ["IOS_SIGNING_PROFILE_PLIST"]).open("rb") as profile_file:
              profile = plistlib.load(profile_file)

          prefixes = profile.get("ApplicationIdentifierPrefix", [])
          teams = profile.get("TeamIdentifier", [])
          entitlements = profile.get("Entitlements", {})
          certificates = profile.get("DeveloperCertificates", [])
          expiration = profile.get("ExpirationDate")
          if profile.get("Name") != "VoiceRecorder App Store 2026-08-09":
              raise SystemExit("Unexpected provisioning profile name")
          if teams != [expected_team]:
              raise SystemExit("Unexpected provisioning TeamIdentifier")
          if prefixes != [expected_team]:
              raise SystemExit("Unexpected provisioning ApplicationIdentifierPrefix")
          if entitlements.get("com.apple.developer.team-identifier") != expected_team:
              raise SystemExit("Unexpected team entitlement")
          if entitlements.get("application-identifier") != f"{prefixes[0]}.{expected_bundle}":
              raise SystemExit("Unexpected application identifier entitlement")
          if entitlements.get("get-task-allow") is not False:
              raise SystemExit("App Store profile must set get-task-allow to false")
          if "ProvisionedDevices" in profile or profile.get("ProvisionsAllDevices"):
              raise SystemExit("App Store profile must not provision specific devices or all devices")
          if len(certificates) != 1:
              raise SystemExit("App Store profile must contain exactly one distribution certificate")
          if not isinstance(expiration, datetime.datetime):
              raise SystemExit("Provisioning profile has no valid expiration date")
          expiration_utc = expiration.replace(tzinfo=datetime.timezone.utc) if expiration.tzinfo is None else expiration
          if expiration_utc <= datetime.datetime.now(datetime.timezone.utc):
              raise SystemExit("Provisioning profile is expired")

          profile_certificate_sha1 = hashlib.sha1(certificates[0]).hexdigest().upper()
          if profile_certificate_sha1 != os.environ["IOS_SIGNING_IDENTITY_SHA1"].upper():
              raise SystemExit("Provisioning profile certificate does not match imported identity")

          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as github_environment:
              github_environment.write(f"APPLE_TEAM_ID={expected_team}\n")
              github_environment.write(f"IOS_PROFILE_UUID={profile['UUID']}\n")
              github_environment.write(f"IOS_PROFILE_NAME={profile['Name']}\n")
              github_environment.write(f"IOS_PROFILE_CERTIFICATE_SHA1={profile_certificate_sha1}\n")
          PY

          IOS_PROFILE_INSTALL_DIRECTORY="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$IOS_PROFILE_INSTALL_DIRECTORY"
          IOS_PROFILE_INSTALL_PATH="$IOS_PROFILE_INSTALL_DIRECTORY/$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$IOS_SIGNING_PROFILE_PLIST").mobileprovision"
          cp "$IOS_SIGNING_PROFILE_PATH" "$IOS_PROFILE_INSTALL_PATH"
          echo "IOS_KEYCHAIN_PATH=${IOS_KEYCHAIN_PATH}" >> "$GITHUB_ENV"
          echo "IOS_KEYCHAIN_PASSWORD=${IOS_KEYCHAIN_PASSWORD}" >> "$GITHUB_ENV"
          echo "IOS_SIGNING_IDENTITY_SHA1=${IOS_SIGNING_IDENTITY_SHA1}" >> "$GITHUB_ENV"
          echo "IOS_SIGNING_P12_PATH=${IOS_SIGNING_P12_PATH}" >> "$GITHUB_ENV"
          echo "IOS_SIGNING_PROFILE_PATH=${IOS_SIGNING_PROFILE_PATH}" >> "$GITHUB_ENV"
          echo "IOS_SIGNING_PROFILE_PLIST=${IOS_SIGNING_PROFILE_PLIST}" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_INSTALL_PATH=${IOS_PROFILE_INSTALL_PATH}" >> "$GITHUB_ENV"
          echo "Manual signing identity and App Store profile validated and installed"

      - name: Select and validate AdMob configuration
        run: |
          set -euo pipefail
          case "${ADMOB_CONFIGURATION}" in
            test)
              EFFECTIVE_APP_ID="${ADMOB_TEST_APP_ID}"
              EFFECTIVE_BANNER_ID="${ADMOB_TEST_BANNER_UNIT_ID}"
              if [[ "${{ inputs.upload_to_app_store }}" == "true" ]] && \
                 [[ "${{ inputs.confirm_internal_testflight_only }}" != "true" ]]; then
                echo "Uploading a test-ID build requires confirm_internal_testflight_only=true"
                exit 1
              fi
              ;;
            production)
              EFFECTIVE_APP_ID="${ADMOB_PRODUCTION_IOS_APP_ID}"
              EFFECTIVE_BANNER_ID="${ADMOB_PRODUCTION_IOS_BANNER_UNIT_ID}"
              if [[ ! "${EFFECTIVE_APP_ID}" =~ ^ca-app-pub-[0-9]{16}~[0-9]{10}$ ]]; then
                echo "Missing or invalid ADMOB_IOS_APP_ID secret"
                exit 1
              fi
              if [[ ! "${EFFECTIVE_BANNER_ID}" =~ ^ca-app-pub-[0-9]{16}/[0-9]{10}$ ]]; then
                echo "Missing or invalid ADMOB_IOS_BANNER_UNIT_ID secret"
                exit 1
              fi
              if [[ "${EFFECTIVE_APP_ID}" == ca-app-pub-3940256099942544~* ]] || \
                 [[ "${EFFECTIVE_BANNER_ID}" == ca-app-pub-3940256099942544/* ]]; then
                echo "Google demo identifiers are forbidden in the production configuration"
                exit 1
              fi
              if [[ "${{ inputs.upload_to_app_store }}" == "true" ]] && \
                 [[ "${{ inputs.confirm_admob_idfa_message_unpublished }}" != "true" ]]; then
                echo "A production upload requires the AdMob IDFA message to remain unpublished so the app can enforce its consent gate"
                exit 1
              fi
              ;;
            *)
              echo "Unknown AdMob configuration"
              exit 1
              ;;
          esac
          echo "ADMOB_IOS_APP_ID=${EFFECTIVE_APP_ID}" >> "${GITHUB_ENV}"
          echo "ADMOB_IOS_BANNER_UNIT_ID=${EFFECTIVE_BANNER_ID}" >> "${GITHUB_ENV}"
          echo "Selected AdMob configuration: ${ADMOB_CONFIGURATION}"

      - name: Generate native Xcode project
        working-directory: native-ios
        run: xcodegen generate

      - name: Verify explicit GDPR-to-ATT consent gate
        run: |
          set -euo pipefail
          CONSENT_SOURCE="native-ios/Sources/AdConsentManager.swift"
          grep -Fq 'import UserMessagingPlatform' "${CONSENT_SOURCE}"
          grep -Fq 'ConsentInformation.shared.requestConsentInfoUpdate' "${CONSENT_SOURCE}"
          grep -Fq 'ConsentForm.loadAndPresentIfRequired' "${CONSENT_SOURCE}"
          grep -Fq 'consentInformation.canRequestAds' "${CONSENT_SOURCE}"
          grep -Fq 'MobileAds.shared.start' "${CONSENT_SOURCE}"
          grep -Fq 'import AppTrackingTransparency' "${CONSENT_SOURCE}"
          grep -Fq 'TrackingConsentEligibility.isATTRequestAllowed' "${CONSENT_SOURCE}"
          grep -Fq 'ATTrackingManager.requestTrackingAuthorization' "${CONSENT_SOURCE}"
          grep -Fq 'IABTCF_gdprApplies' native-ios/Sources/TrackingConsentEligibility.swift
          grep -Fq 'IABTCF_PurposeConsents' native-ios/Sources/TrackingConsentEligibility.swift
          grep -Fq 'IABTCF_PurposeLegitimateInterests' native-ios/Sources/TrackingConsentEligibility.swift
          grep -Fq 'IABTCF_VendorConsents' native-ios/Sources/TrackingConsentEligibility.swift
          grep -Fq 'IABTCF_VendorLegitimateInterests' native-ios/Sources/TrackingConsentEligibility.swift
          grep -Fq 'AppTrackingTransparency.framework' native-ios/project.yml
          if grep -Fq 'setPublisherFirstPartyIDEnabled(false)' "${CONSENT_SOURCE}" || \
             grep -Fq 'publisherPrivacyPersonalizationState = .disabled' "${CONSENT_SOURCE}"; then
            echo "The ATT candidate must not force the previous non-tracking AdMob configuration"
            exit 1
          fi
          grep -Fq '<key>NSUserTrackingUsageDescription</key>' native-ios/Resources/Info.plist
          for LOCALE in ca de en es fr it pt; do
            TRACKING_COPY="$(plutil -extract NSUserTrackingUsageDescription raw -o - "native-ios/Resources/${LOCALE}.lproj/InfoPlist.strings")"
            test -n "${TRACKING_COPY}"
          done
          python3 scripts/validate-privacy-manifests.py \
            --app-manifest native-ios/Resources/PrivacyInfo.xcprivacy \
            native-ios/Resources

      - name: Test GDPR-to-ATT consent decisions
        run: |
          set -euo pipefail
          SIMULATOR_UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin).get("devices", {})
          for runtime_devices in devices.values():
              for device in runtime_devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator")
          ')"
          xcodebuild test \
            -project native-ios/AudioRecorder.xcodeproj \
            -scheme AudioRecorder \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive signed app
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project native-ios/AudioRecorder.xcodeproj \
            -scheme AudioRecorder \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/appstore/AudioRecorder.xcarchive \
            MARKETING_VERSION="${APP_VERSION}" \
            CURRENT_PROJECT_VERSION="${APP_BUILD_NUMBER}" \
            ADMOB_IOS_APP_ID="${ADMOB_IOS_APP_ID}" \
            ADMOB_IOS_BANNER_UNIT_ID="${ADMOB_IOS_BANNER_UNIT_ID}" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${IOS_SIGNING_IDENTITY_SHA1}" \
            PROVISIONING_PROFILE_SPECIFIER="${IOS_PROFILE_UUID}" \
            "OTHER_CODE_SIGN_FLAGS=--keychain ${IOS_KEYCHAIN_PATH}"

      - name: Verify archived candidate
        run: |
          set -euo pipefail
          ARCHIVE_PATH="build/appstore/AudioRecorder.xcarchive"
          APP_BUNDLE="${ARCHIVE_PATH}/Products/Applications/AudioRecorder.app"
          APP_PLIST="${APP_BUNDLE}/Info.plist"
          test -f "${APP_PLIST}"
          test -f "${APP_BUNDLE}/PrivacyInfo.xcprivacy"
          test -f "${APP_BUNDLE}/Assets.car"
          test -f "${APP_BUNDLE}/embedded.mobileprovision"
          find "${ARCHIVE_PATH}/dSYMs" -name '*.dSYM' -type d -print -quit | grep -q .
          ARCHIVED_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${APP_PLIST}")"
          ARCHIVED_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${APP_PLIST}")"
          ARCHIVED_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${APP_PLIST}")"
          ARCHIVED_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :GADApplicationIdentifier' "${APP_PLIST}")"
          ARCHIVED_BANNER_ID="$(/usr/libexec/PlistBuddy -c 'Print :ADMOBBannerUnitID' "${APP_PLIST}")"
          if [[ "${ARCHIVED_BUNDLE_ID}" != "com.dmkr.audio.B2X6D3A9J9" ]] || \
             [[ "${ARCHIVED_VERSION}" != "${APP_VERSION}" ]] || \
             [[ "${ARCHIVED_BUILD}" != "${APP_BUILD_NUMBER}" ]]; then
            echo "Archived identity, version, or build number is not the expected candidate"
            exit 1
          fi
          if [[ "${ARCHIVED_APP_ID}" != "${ADMOB_IOS_APP_ID}" ]] || \
             [[ "${ARCHIVED_BANNER_ID}" != "${ADMOB_IOS_BANNER_UNIT_ID}" ]]; then
            echo "Archived app does not contain the selected AdMob configuration"
            exit 1
          fi
          python3 scripts/validate-privacy-manifests.py \
            --app-manifest "${APP_BUNDLE}/PrivacyInfo.xcprivacy" \
            "${APP_BUNDLE}"
          if ! /usr/libexec/PlistBuddy -c 'Print :NSUserTrackingUsageDescription' "${APP_PLIST}" >/dev/null 2>&1; then
            echo "Archived app is missing the ATT tracking-purpose string"
            exit 1
          fi
          for LOCALE in ca de en es fr it pt; do
            TRACKING_COPY="$(plutil -extract NSUserTrackingUsageDescription raw -o - "${APP_BUNDLE}/${LOCALE}.lproj/InfoPlist.strings")"
            test -n "${TRACKING_COPY}"
          done
          for LOCALE in ca de en es fr it pt; do
            test -d "${APP_BUNDLE}/${LOCALE}.lproj"
          done
          codesign --verify --deep --strict --verbose=2 "${APP_BUNDLE}"
          security cms -D -i "${APP_BUNDLE}/embedded.mobileprovision" > build/appstore/profile.plist
          PROFILE_TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' build/appstore/profile.plist)"
          PROFILE_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' build/appstore/profile.plist)"
          PROFILE_GET_TASK_ALLOW="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' build/appstore/profile.plist)"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' build/appstore/profile.plist)"
          ARCHIVED_PROFILE_CERTIFICATE_SHA1="$(python3 - <<'PY'
          import hashlib
          import plistlib

          with open("build/appstore/profile.plist", "rb") as profile_file:
              profile = plistlib.load(profile_file)
          certificates = profile.get("DeveloperCertificates", [])
          if len(certificates) != 1:
              raise SystemExit("Archived profile must contain exactly one certificate")
          print(hashlib.sha1(certificates[0]).hexdigest().upper())
          PY
          )"
          if [[ "${PROFILE_TEAM_ID}" != "${APPLE_TEAM_ID}" ]] || \
             [[ "${PROFILE_APP_ID}" != "${APPLE_TEAM_ID}.com.dmkr.audio.B2X6D3A9J9" ]] || \
             [[ "${PROFILE_GET_TASK_ALLOW}" != "false" ]] || \
             [[ "${PROFILE_UUID}" != "${IOS_PROFILE_UUID}" ]] || \
             [[ "${ARCHIVED_PROFILE_CERTIFICATE_SHA1}" != "${IOS_PROFILE_CERTIFICATE_SHA1}" ]]; then
            echo "Archive does not use the expected App Store distribution profile and certificate"
            exit 1
          fi
          ARCHIVED_DEVICE_FAMILY="$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:0' "${APP_PLIST}")"
          if [[ "${ARCHIVED_DEVICE_FAMILY}" != "1" ]]; then
            echo "The VoiceRecorder 1.0 archive must target iPhone only"
            exit 1
          fi

      - name: Retain signed archive and dSYM
        uses: actions/upload-artifact@v4
        with:
          name: AudioRecorder-${{ env.APP_VERSION }}-${{ inputs.ad_configuration }}-archive-build-${{ inputs.build_number }}-${{ github.sha }}-TestFlight
          path: build/appstore/AudioRecorder.xcarchive
          retention-days: 7

      - name: Export IPA
        run: |
          set -euo pipefail
          INTERNAL_TESTFLIGHT_OPTION=""
          if [[ "${ADMOB_CONFIGURATION}" == "test" ]]; then
            INTERNAL_TESTFLIGHT_OPTION="<key>testFlightInternalTestingOnly</key><true/>"
          fi
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>${IOS_SIGNING_IDENTITY_SHA1}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.dmkr.audio.B2X6D3A9J9</key>
              <string>${IOS_PROFILE_UUID}</string>
            </dict>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            ${INTERNAL_TESTFLIGHT_OPTION}
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          plutil -lint ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/appstore/AudioRecorder.xcarchive \
            -exportPath build/appstore/export \
            -exportOptionsPlist ExportOptions.plist
          ls -lh build/appstore/export

      - name: Verify exported IPA
        run: |
          set -euo pipefail
          IPA_PATH="$(find build/appstore/export -name '*.ipa' -type f | head -n 1)"
          test -n "$IPA_PATH"
          EXPORT_VERIFY_DIRECTORY="$RUNNER_TEMP/voice-recorder-export-verification"
          mkdir -p "$EXPORT_VERIFY_DIRECTORY"
          ditto -x -k "$IPA_PATH" "$EXPORT_VERIFY_DIRECTORY"
          EXPORTED_APP="$(find "$EXPORT_VERIFY_DIRECTORY/Payload" -maxdepth 1 -name '*.app' -type d | head -n 1)"
          test -n "$EXPORTED_APP"
          codesign --verify --deep --strict --verbose=2 "$EXPORTED_APP"
          EXPORTED_PLIST="$EXPORTED_APP/Info.plist"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$EXPORTED_PLIST")" == "com.dmkr.audio.B2X6D3A9J9" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$EXPORTED_PLIST")" == "$APP_VERSION" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$EXPORTED_PLIST")" == "$APP_BUILD_NUMBER" ]]
          security cms -D -i "$EXPORTED_APP/embedded.mobileprovision" > "$RUNNER_TEMP/exported-profile.plist"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/exported-profile.plist")" == "$IOS_PROFILE_UUID" ]]
          for LOCALE in ca de en es fr it pt; do
            test -d "$EXPORTED_APP/${LOCALE}.lproj"
          done
          python3 scripts/validate-privacy-manifests.py \
            --app-manifest "$EXPORTED_APP/PrivacyInfo.xcprivacy" \
            "$EXPORTED_APP"
          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$EXPORTED_PLIST")"
          EXECUTABLE_UUIDS="$(dwarfdump --uuid "$EXPORTED_APP/$EXECUTABLE_NAME" | awk '{ print $2 }' | sort)"
          DSYM_UUIDS="$(dwarfdump --uuid build/appstore/AudioRecorder.xcarchive/dSYMs/AudioRecorder.app.dSYM | awk '{ print $2 }' | sort)"
          [[ -n "$EXECUTABLE_UUIDS" && "$EXECUTABLE_UUIDS" == "$DSYM_UUIDS" ]]
          shasum -a 256 "$IPA_PATH"

      - name: Validate exported IPA with App Store Connect
        if: inputs.validate_with_app_store
        run: |
          set -euo pipefail
          IPA_PATH="$(find build/appstore/export -name '*.ipa' -type f | head -n 1)"
          test -n "${IPA_PATH}"
          xcrun altool --validate-app \
            --type ios \
            --file "${IPA_PATH}" \
            --apiKey "${ASC_KEY_ID}" \
            --apiIssuer "${ASC_ISSUER_ID}"

      - name: Upload to App Store Connect (never submits for review)
        if: inputs.upload_to_app_store
        run: |
          set -euo pipefail
          IPA_PATH="$(find build/appstore/export -name '*.ipa' -type f | head -n 1)"
          if [ -z "${IPA_PATH}" ]; then
            echo "No IPA exported"
            exit 1
          fi
          xcrun altool --upload-app \
            --type ios \
            --file "${IPA_PATH}" \
            --apiKey "${ASC_KEY_ID}" \
            --apiIssuer "${ASC_ISSUER_ID}"

      - name: Upload exported IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioRecorder-${{ env.APP_VERSION }}-${{ inputs.ad_configuration }}-ipa-build-${{ inputs.build_number }}-${{ github.sha }}-TestFlight
          path: build/appstore/export/*.ipa
          retention-days: 7
      - name: Clean temporary signing material
        if: always()
        run: |
          set +e
          if [[ -n "${IOS_KEYCHAIN_PATH:-}" && -f "${IOS_KEYCHAIN_PATH}" ]]; then
            security default-keychain -d user -s login.keychain-db
            security delete-keychain "${IOS_KEYCHAIN_PATH}"
          fi
          rm -f \
            "${ASC_PRIVATE_KEY_PATH:-}" \
            "${IOS_PROFILE_INSTALL_PATH:-}" \
            "${IOS_SIGNING_P12_PATH:-}" \
            "${IOS_SIGNING_PROFILE_PATH:-}" \
            "${IOS_SIGNING_PROFILE_PLIST:-}" \
            "$RUNNER_TEMP/exported-profile.plist"
