name: Upload iOS App Store Build

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Unique positive build number for version 1.0
        required: true
        type: string
      ad_configuration:
        description: AdMob configuration embedded in the signed build
        required: true
        default: test
        type: choice
        options:
          - test
          - production
      confirm_internal_testflight_only:
        description: Required to upload a test-ID build; confirms Internal TestFlight only (never external testing or App Review)
        required: true
        default: false
        type: boolean
      validate_with_app_store:
        description: Validate the exported IPA with App Store Connect without uploading it for testing
        required: true
        default: false
        type: boolean
      upload_to_app_store:
        description: Upload the exported IPA to App Store Connect (does not submit it for review)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  upload:
    if: github.actor == github.repository_owner
    runs-on: macos-latest
    environment: app-store-production
    env:
      APP_VERSION: "1.0"
      APP_BUILD_NUMBER: ${{ inputs.build_number }}
      ADMOB_CONFIGURATION: ${{ inputs.ad_configuration }}
      ADMOB_TEST_APP_ID: ca-app-pub-3940256099942544~1458002511
      ADMOB_TEST_BANNER_UNIT_ID: ca-app-pub-3940256099942544/2435281174
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
      ADMOB_PRODUCTION_IOS_APP_ID: ${{ secrets.ADMOB_IOS_APP_ID }}
      ADMOB_PRODUCTION_IOS_BANNER_UNIT_ID: ${{ secrets.ADMOB_IOS_BANNER_UNIT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Apple submission toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk '/^Xcode / { split($2, version, "."); print version[1] }')"
          IOS_SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          IOS_SDK_MAJOR="${IOS_SDK_VERSION%%.*}"
          echo "iOS SDK ${IOS_SDK_VERSION}"
          if [[ -z "${XCODE_MAJOR}" ]] || (( XCODE_MAJOR < 26 )); then
            echo "Xcode 26 or later is required for App Store Connect submissions"
            exit 1
          fi
          if [[ -z "${IOS_SDK_MAJOR}" ]] || (( IOS_SDK_MAJOR < 26 )); then
            echo "The iOS 26 SDK or later is required for App Store Connect submissions"
            exit 1
          fi

      - name: Validate candidate build number
        run: |
          set -euo pipefail
          if [[ ! "${APP_BUILD_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "build_number must be a positive integer not previously used for version ${APP_VERSION}"
            exit 1
          fi
          echo "Preparing version ${APP_VERSION} build ${APP_BUILD_NUMBER}"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install App Store Connect API key
        run: |
          set -euo pipefail
          if [ -z "${ASC_KEY_ID}" ] || [ -z "${ASC_ISSUER_ID}" ] || [ -z "${ASC_PRIVATE_KEY_BASE64}" ] || [ -z "${APPLE_TEAM_ID}" ]; then
            echo "Missing ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY_BASE64, or APPLE_TEAM_ID secret"
            exit 1
          fi
          mkdir -p "$HOME/private_keys"
          echo "${ASC_PRIVATE_KEY_BASE64}" | base64 --decode > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Select and validate AdMob configuration
        run: |
          set -euo pipefail
          case "${ADMOB_CONFIGURATION}" in
            test)
              EFFECTIVE_APP_ID="${ADMOB_TEST_APP_ID}"
              EFFECTIVE_BANNER_ID="${ADMOB_TEST_BANNER_UNIT_ID}"
              if [[ "${{ inputs.upload_to_app_store }}" == "true" ]] && \
                 [[ "${{ inputs.confirm_internal_testflight_only }}" != "true" ]]; then
                echo "Uploading a test-ID build requires confirm_internal_testflight_only=true"
                exit 1
              fi
              ;;
            production)
              EFFECTIVE_APP_ID="${ADMOB_PRODUCTION_IOS_APP_ID}"
              EFFECTIVE_BANNER_ID="${ADMOB_PRODUCTION_IOS_BANNER_UNIT_ID}"
              if [[ ! "${EFFECTIVE_APP_ID}" =~ ^ca-app-pub-[0-9]{16}~[0-9]{10}$ ]]; then
                echo "Missing or invalid ADMOB_IOS_APP_ID secret"
                exit 1
              fi
              if [[ ! "${EFFECTIVE_BANNER_ID}" =~ ^ca-app-pub-[0-9]{16}/[0-9]{10}$ ]]; then
                echo "Missing or invalid ADMOB_IOS_BANNER_UNIT_ID secret"
                exit 1
              fi
              if [[ "${EFFECTIVE_APP_ID}" == ca-app-pub-3940256099942544~* ]] || \
                 [[ "${EFFECTIVE_BANNER_ID}" == ca-app-pub-3940256099942544/* ]]; then
                echo "Google demo identifiers are forbidden in the production configuration"
                exit 1
              fi
              ;;
            *)
              echo "Unknown AdMob configuration"
              exit 1
              ;;
          esac
          echo "ADMOB_IOS_APP_ID=${EFFECTIVE_APP_ID}" >> "${GITHUB_ENV}"
          echo "ADMOB_IOS_BANNER_UNIT_ID=${EFFECTIVE_BANNER_ID}" >> "${GITHUB_ENV}"
          echo "Selected AdMob configuration: ${ADMOB_CONFIGURATION}"

      - name: Generate native Xcode project
        working-directory: native-ios
        run: xcodegen generate

      - name: Archive signed app
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project native-ios/AudioRecorder.xcodeproj \
            -scheme AudioRecorder \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/appstore/AudioRecorder.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}" \
            MARKETING_VERSION="${APP_VERSION}" \
            CURRENT_PROJECT_VERSION="${APP_BUILD_NUMBER}" \
            ADMOB_IOS_APP_ID="${ADMOB_IOS_APP_ID}" \
            ADMOB_IOS_BANNER_UNIT_ID="${ADMOB_IOS_BANNER_UNIT_ID}" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CODE_SIGN_STYLE=Automatic

      - name: Verify archived candidate
        run: |
          set -euo pipefail
          ARCHIVE_PATH="build/appstore/AudioRecorder.xcarchive"
          APP_BUNDLE="${ARCHIVE_PATH}/Products/Applications/AudioRecorder.app"
          APP_PLIST="${APP_BUNDLE}/Info.plist"
          test -f "${APP_PLIST}"
          test -f "${APP_BUNDLE}/PrivacyInfo.xcprivacy"
          test -f "${APP_BUNDLE}/Assets.car"
          test -f "${APP_BUNDLE}/embedded.mobileprovision"
          find "${ARCHIVE_PATH}/dSYMs" -name '*.dSYM' -type d -print -quit | grep -q .
          ARCHIVED_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${APP_PLIST}")"
          ARCHIVED_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${APP_PLIST}")"
          ARCHIVED_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${APP_PLIST}")"
          ARCHIVED_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :GADApplicationIdentifier' "${APP_PLIST}")"
          ARCHIVED_BANNER_ID="$(/usr/libexec/PlistBuddy -c 'Print :ADMOBBannerUnitID' "${APP_PLIST}")"
          if [[ "${ARCHIVED_BUNDLE_ID}" != "com.dmkr.audio.B2X6D3A9J9" ]] || \
             [[ "${ARCHIVED_VERSION}" != "${APP_VERSION}" ]] || \
             [[ "${ARCHIVED_BUILD}" != "${APP_BUILD_NUMBER}" ]]; then
            echo "Archived identity, version, or build number is not the expected candidate"
            exit 1
          fi
          if [[ "${ARCHIVED_APP_ID}" != "${ADMOB_IOS_APP_ID}" ]] || \
             [[ "${ARCHIVED_BANNER_ID}" != "${ADMOB_IOS_BANNER_UNIT_ID}" ]]; then
            echo "Archived app does not contain the selected AdMob configuration"
            exit 1
          fi
          for LOCALE in ca de en es fr it pt; do
            test -d "${APP_BUNDLE}/${LOCALE}.lproj"
          done
          codesign --verify --deep --strict --verbose=2 "${APP_BUNDLE}"
          security cms -D -i "${APP_BUNDLE}/embedded.mobileprovision" > build/appstore/profile.plist
          PROFILE_TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' build/appstore/profile.plist)"
          PROFILE_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' build/appstore/profile.plist)"
          PROFILE_GET_TASK_ALLOW="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' build/appstore/profile.plist)"
          if [[ "${PROFILE_TEAM_ID}" != "${APPLE_TEAM_ID}" ]] || \
             [[ "${PROFILE_APP_ID}" != "${APPLE_TEAM_ID}.com.dmkr.audio.B2X6D3A9J9" ]] || \
             [[ "${PROFILE_GET_TASK_ALLOW}" != "false" ]]; then
            echo "Archive does not use the expected App Store distribution profile"
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "${APP_PLIST}"

      - name: Retain signed archive and dSYM
        uses: actions/upload-artifact@v4
        with:
          name: AudioRecorder-${{ inputs.ad_configuration }}-archive-build-${{ inputs.build_number }}
          path: build/appstore/AudioRecorder.xcarchive
          retention-days: 7

      - name: Export IPA
        run: |
          set -euo pipefail
          INTERNAL_TESTFLIGHT_OPTION=""
          if [[ "${ADMOB_CONFIGURATION}" == "test" ]]; then
            INTERNAL_TESTFLIGHT_OPTION="<key>testFlightInternalTestingOnly</key><true/>"
          fi
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            ${INTERNAL_TESTFLIGHT_OPTION}
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          plutil -lint ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/appstore/AudioRecorder.xcarchive \
            -exportPath build/appstore/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}"
          ls -lh build/appstore/export

      - name: Validate exported IPA with App Store Connect
        if: inputs.validate_with_app_store
        run: |
          set -euo pipefail
          IPA_PATH="$(find build/appstore/export -name '*.ipa' -type f | head -n 1)"
          test -n "${IPA_PATH}"
          xcrun altool --validate-app \
            --type ios \
            --file "${IPA_PATH}" \
            --apiKey "${ASC_KEY_ID}" \
            --apiIssuer "${ASC_ISSUER_ID}"

      - name: Upload to App Store Connect (never submits for review)
        if: inputs.upload_to_app_store
        run: |
          set -euo pipefail
          IPA_PATH="$(find build/appstore/export -name '*.ipa' -type f | head -n 1)"
          if [ -z "${IPA_PATH}" ]; then
            echo "No IPA exported"
            exit 1
          fi
          xcrun altool --upload-app \
            --type ios \
            --file "${IPA_PATH}" \
            --apiKey "${ASC_KEY_ID}" \
            --apiIssuer "${ASC_ISSUER_ID}"

      - name: Upload exported IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioRecorder-${{ inputs.ad_configuration }}-ipa-build-${{ inputs.build_number }}
          path: build/appstore/export/*.ipa
          retention-days: 7
