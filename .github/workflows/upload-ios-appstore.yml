name: Upload iOS App Store Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    if: github.actor == github.repository_owner
    runs-on: macos-latest
    environment: app-store-production
    env:
      APP_VERSION: "1.0"
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install App Store Connect API key
        run: |
          set -euo pipefail
          if [ -z "${ASC_KEY_ID}" ] || [ -z "${ASC_ISSUER_ID}" ] || [ -z "${ASC_PRIVATE_KEY_BASE64}" ] || [ -z "${APPLE_TEAM_ID}" ]; then
            echo "Missing ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY_BASE64, or APPLE_TEAM_ID secret"
            exit 1
          fi
          mkdir -p "$HOME/private_keys"
          echo "${ASC_PRIVATE_KEY_BASE64}" | base64 --decode > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Generate native Xcode project
        working-directory: native-ios
        run: xcodegen generate

      - name: Archive signed app
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project native-ios/AudioRecorder.xcodeproj \
            -scheme AudioRecorder \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/appstore/AudioRecorder.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}" \
            MARKETING_VERSION="${APP_VERSION}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CODE_SIGN_STYLE=Automatic

      - name: Export IPA
        run: |
          set -euo pipefail
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/appstore/AudioRecorder.xcarchive \
            -exportPath build/appstore/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}"
          ls -lh build/appstore/export

      - name: Upload to App Store Connect
        run: |
          set -euo pipefail
          IPA_PATH="$(find build/appstore/export -name '*.ipa' -type f | head -n 1)"
          if [ -z "${IPA_PATH}" ]; then
            echo "No IPA exported"
            exit 1
          fi
          xcrun altool --upload-app \
            --type ios \
            --file "${IPA_PATH}" \
            --apiKey "${ASC_KEY_ID}" \
            --apiIssuer "${ASC_ISSUER_ID}"

      - name: Upload exported IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioRecorder-appstore-ipa
          path: build/appstore/export/*.ipa
          retention-days: 7
